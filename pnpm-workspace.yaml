allowBuilds:
  esbuild: true

# pnpm 11 reads overrides from here, not from `pnpm.overrides` in package.json.
# These pin transitive dev dependencies past known advisories so `pnpm audit
# --audit-level=high` (the Package Audit CI job) stays green.
overrides:
  brace-expansion: '>=5.0.9'
  js-yaml: '>=3.15.2'
  lodash: '>=4.17.24'
  minimatch: '>=10.2.3'
  picomatch: '>=4.0.4'
  smol-toml: '>=1.7.1'
  tar: '>=7.5.21'

# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) has no patched release on npm yet, so it
# cannot be overridden. It is only reached through ava > globby > fast-glob >
# micromatch (test-file globbing), never shipped. Drop this once braces >=3.0.4
# is published.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
